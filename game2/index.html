<script>
let ac=null, mainGain=null, currentLevel=0, isAudioPlaying=false, synthInterval=null;

/* WEBAUDIO SOUND SYNTHESIZER */
function initAudio(){
 if(!ac){
  ac=new(window.AudioContext || window.webkitAudioContext)();
  mainGain=ac.createGain();
  mainGain.gain.setValueAtTime(0.08, ac.currentTime);
  mainGain.connect(ac.destination);
  startSpaceSynth();
 }
 if(ac.state==="suspended") ac.resume();
}

function startSpaceSynth(){
 const notes = [261.63, 311.13, 392.00, 466.16, 523.25, 622.25, 783.99];
 let idx = 0;
 synthInterval = setInterval(()=>{
  if(!isAudioPlaying || !ac || ac.state!=="running") return;
  try{
   let osc = ac.createOscillator();
   let g = ac.createGain();
   osc.type = 'triangle';
   osc.frequency.setValueAtTime(notes[idx % notes.length], ac.currentTime);
   g.gain.setValueAtTime(0.035, ac.currentTime);
   g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.22);
   osc.connect(g); g.connect(mainGain);
   osc.start(); osc.stop(ac.currentTime + 0.24);
   idx++;
  }catch(e){}
 }, 200);
}

function toggleAudio(){
 initAudio();
 isAudioPlaying = !isAudioPlaying;
 if(mainGain){ mainGain.gain.setTargetAtTime(isAudioPlaying ? 0.08 : 0, ac.currentTime, 0.05); }
 $("mText").textContent = isAudioPlaying ? "الموسيقى: شغال 🎵" : "الموسيقى: متوقف 🔇";
}

function tone(f=440, d=.16, t="sine", v=.04, delay=0){
 if(!ac || !isAudioPlaying)return;
 setTimeout(()=>{
  try{
   let o=ac.createOscillator(), g=ac.createGain();
   o.type=t; o.frequency.value=f;
   g.gain.setValueAtTime(.0001, ac.currentTime);
   g.gain.exponentialRampToValueAtTime(v, ac.currentTime+.015);
   g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+d);
   o.connect(g); g.connect(mainGain);
   o.start(); o.stop(ac.currentTime+d+.03);
  }catch(e){}
 },delay);
}

function goodSound(){ tone(523,.22,"sine",.05); tone(659,.25,"sine",.045,90); tone(784,.38,"sine",.04,180); }
function badSound(){ tone(170,.16,"triangle",.025); tone(120,.22,"triangle",.018,90); }
function boomSound(){ tone(100,.4,"sawtooth",.08); tone(60,.6,"square",.08,40); tone(40,.8,"sine",.09,90); }
function pop(){ tone(330,.08,"sine",.025); tone(660,.12,"sine",.02,50); }

/* CANVAS STARS & PARTICLES */
const sc=$("stars"), fc=$("fx");
const sx=sc.getContext("2d"), fx=fc.getContext("2d");
let stars=[], parts=[];

function resize(){
 sc.width=fc.width=innerWidth*devicePixelRatio;
 sc.height=fc.height=innerHeight*devicePixelRatio;
 sx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 fx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
resize(); addEventListener("resize", resize);

for(let i=0;i<150;i++){
 stars.push({ x:Math.random()*innerWidth, y:Math.random()*innerHeight, r:.4+Math.random()*1.5, p:Math.random()*7, s:.3+Math.random()*.8 });
}

function starLoop(){
 sx.clearRect(0,0,innerWidth,innerHeight);
 let t=performance.now()/1000;
 for(let s of stars){
  sx.beginPath(); sx.arc(s.x, s.y, s.r, 0, 7);
  sx.fillStyle=`rgba(255,190,230,${.25+.5*(Math.sin(t*s.s+s.p)+1)/2})`;
  sx.fill();
 }
 requestAnimationFrame(starLoop);
}
starLoop();

function particle(x, y, c){
 parts.push({ x:x, y:y, vx:(Math.random()-.5)*8, vy:(Math.random()-.5)*8, life:1, size:2+Math.random()*5, c:c });
}

function fxLoop(){
 fx.clearRect(0,0,innerWidth,innerHeight);
 for(let i=parts.length-1; i>=0; i--){
  let p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=.03; p.life-=.02;
  if(p.life<=0){ parts.splice(i,1); continue; }
  fx.globalAlpha=p.life; fx.beginPath(); fx.arc(p.x, p.y, p.size*p.life, 0, 7);
  fx.fillStyle=p.c; fx.fill();
 }
 fx.globalAlpha=1; requestAnimationFrame(fxLoop);
}
fxLoop();

function burst(x=innerWidth/2, y=innerHeight/2, n=25){
 let cs=["#ff4da6","#ff9dcc","#d77aff","#fff","#00ffcc"];
 for(let i=0; i<n; i++) particle(x, y, cs[Math.floor(Math.random()*cs.length)]);
 hearts(x, y, Math.min(12, Math.ceil(n/3)));
}

function hearts(x, y, n=6){
 for(let i=0; i<n; i++){
  let h=document.createElement("div"); h.textContent="♥";
  h.style.cssText=`position:absolute; left:${x}px; top:${y}px; color:${["#ff4da6","#ff83bd","#d77aff"][i%3]}; font-size:${14+Math.random()*18}px; transition:1.2s; pointer-events:none; z-index:40;`;
  $("hearts").appendChild(h);
  requestAnimationFrame(()=>{
   h.style.transform=`translate(${(Math.random()-.5)*220}px, ${-60-Math.random()*200}px) rotate(${(Math.random()-.5)*90}deg)`;
   h.style.opacity=0;
  });
  setTimeout(()=>h.remove(), 1250);
 }
}

function toast(t){
 $("toast").textContent=t; $("toast").classList.add("show");
 clearTimeout(window.tt); window.tt=setTimeout(()=>$("toast").classList.remove("show"), 1700);
}

/* APP RENDERER & CONTROLLER */
function renderScreen(n){
 const container = $("screenContainer");
 container.innerHTML = "";
 const data = levelsData[n];
 const sec = document.createElement("section");
 sec.className = "screen active";
 sec.id = "s" + n;

 if(data.type === "custom"){
  sec.innerHTML = data.render();
 } else {
  let optsHTML = data.opts.map((o, idx)=>`<button onclick="levelsData[${n}].opts[${idx}].f(this)">${o.t}</button>`).join("");
  sec.innerHTML = `
   <div class="card">
    <h2>${data.title}</h2>
    <p>${data.q}</p>
    <div class="grid">${optsHTML}</div>
   </div>`;
 }
 container.appendChild(sec);
 currentLevel = n;
 $("bar").style.width = (n / 50 * 100) + "%";
 if(n === 42) startWaitTimer();
}

function startApp(){
 isAudioPlaying = true;
 initAudio();
 goodSound();
 go(1);
}

function go(n){
 burst(innerWidth/2, innerHeight/2, 18); pop();
 renderScreen(n);
}

function bad(btn, msg){
 badSound();
 if(btn && btn.classList){ btn.classList.remove("shake"); void btn.offsetWidth; btn.classList.add("shake"); }
 toast(msg); burst(innerWidth/2, innerHeight/2, 6);
}

function good(n){ goodSound(); burst(innerWidth/2, innerHeight/2, 30); setTimeout(()=>go(n), 400); }

/* SPECIAL TRICKS INTERACTIVE LOGIC */

let moveInterval = setInterval(()=>{

  $("exMsg").textContent = `تم تفجير الفخ (${explodedCount}/3) 💥`;
 }
}

// Memory Lock (#11)
function tile(i){
 if(!seq.length) seq=[4, 1, 2, 0, 3, 5];
 if(i!==seq[step]){
  badSound(); $("m11").textContent="خطأ! إعادة الترتيب من جديد 😂"; step=0;
  document.querySelectorAll(".tile").forEach(x=>x.classList.remove("off"));
  return;
 }
 goodSound();
 document.querySelector(`[data-i="${i}"]`).classList.add("off");
 burst(innerWidth/2, innerHeight/2, 10); step++;
 if(step===seq.length){
  $("m11").textContent="تم فك الشفرة بنجاح 🔓";
  setTimeout(()=>go(12), 750);
 }
}

// Drag Planet (#41)
function startDrag(e){
 let planet = $("planet");
 let moveHandler = (ev)=>{
  let clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
  planet.style.left = (clientX - 40) + "px";
 };
 let upHandler = ()=>{
  window.removeEventListener("mousemove", moveHandler);
  window.removeEventListener("mouseup", upHandler);
  window.removeEventListener("touchmove", moveHandler);
  window.removeEventListener("touchend", upHandler);
 };
 window.addEventListener("mousemove", moveHandler);
 window.addEventListener("mouseup", upHandler);
 window.addEventListener("touchmove", moveHandler);
 window.addEventListener("touchend", upHandler);
}

// Wait Timer (#42)
function startWaitTimer(){
 let count = 5;
 if(waitTimer) clearInterval(waitTimer);
 waitTimer = setInterval(()=>{
  count--;
  if($("waitNum")) $("waitNum").textContent = count;
  if(count <= 0){
   clearInterval(waitTimer);
   goodSound(); burst(innerWidth/2, innerHeight/2, 60);
   setTimeout(()=>go(43), 600);
  }
 }, 1000);
}

function nope(){
 noCount++; let b=$("no"); if(!b) return;

}
